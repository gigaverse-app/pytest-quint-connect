version: 2
updates:
  - package-ecosystem: github-actions
    # /report: the published composite action pins its actions by SHA (AGENTS.md); Dependabot only reads
    # an action.yml in a directory listed here.
    directories: ["/", "/report"]
    commit-message:
      prefix: ci
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    commit-message:
      prefix: build
    schedule:
      interval: weekly
    groups:
      development:
        dependency-type: development
