name: Bug report
description: Report a wrong verdict, a decoding problem, or an installation problem.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the case id, the reported mismatch or error, and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A small model, manifest, driver and the exact pytest command. Attach the .itf.json trace if replay reproduces it. Remove secrets and private code.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: pytest-quint-connect version, Quint version, Node.js, Python, pytest, operating system.
    validations:
      required: true
