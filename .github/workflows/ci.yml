name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Only newer revisions of the same PR supersede work; keep every main/manual run.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  select-tests:
    name: Select tests
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
      mode: ${{ steps.files.outputs.mode }}
      files: ${{ steps.files.outputs.test_roots_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Whole lanes first: a change that cannot affect a lane's inputs does not start that lane's jobs.
      - id: plan
        uses: gigaverse-app/pytest-selective/actions/plan-lanes@v1
        with:
          config: .github/test-lanes.json
      - name: Share the lane graph and execution inputs with file selection
        run: |
          uv run --no-project --python 3.14 --with "$(python3 scripts/ci/selector_requirement.py)" \
            python scripts/ci_file_config.py "$RUNNER_TEMP/test-impact.json"
      # Then files: within the tests lane, only the test files the change can reach.
      - id: files
        uses: gigaverse-app/pytest-selective@v1
        with:
          config: ${{ runner.temp }}/test-impact.json
          full-roots: tests

  quality:
    name: Lint, docs and routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.13'
          cache-environment: "false"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python scripts/check_docs.py
      # Routing regressions and the gate check always run: they decide what a skipped lane means.
      - name: Prove lane and file routing on real Git snapshots
        run: >-
          uv run --no-project --python 3.14
          --with "$(python3 scripts/ci/selector_requirement.py)"
          python -m unittest discover -s ci_tests -v
      - name: Check the aggregate gate against the execution lanes
        run: >-
          uv run --no-project --python 3.14
          --with "ci-esta>=1.1.0,<2.0.0"
          ci-esta check-workflow --workflow .github/workflows/ci.yml --lanes .github/test-lanes.json

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      # Quint runs on Node.js; the plugin installs its locked Quint 0.33.1 with npm on first use.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: ${{ matrix.python }}
          cache-environment: "false"
      - name: Execute the shared affected-file plan, with real Quint generation
        env:
          PYTEST_QUINT_CONNECT_CACHE: ${{ runner.temp }}/quint-cache
          CI_PLANNER_RESULT: ${{ needs.select-tests.result }}
          CI_TEST_MODE: ${{ needs.select-tests.outputs.mode }}
          CI_TEST_FILES: ${{ needs.select-tests.outputs.files }}
        run: >-
          uv run --no-sync python scripts/run_ci_tests.py -q -p no:cacheprovider --durations=20
          --junitxml=test-timings.xml
      # CI-esta keeps per-test durations from every run, so slow tests and runner variance stay visible.
      - uses: gigaverse-app/ci-esta/actions/learn-test-timings@v1
        if: ${{ !cancelled() && hashFiles('test-timings.xml') != '' }}
        with:
          junit-pattern: test-timings.xml
          artifact-name: test-timings-${{ matrix.python }}-${{ matrix.os }}

  minimum-pytest:
    name: Test with pytest 8.0 (Python 3.11)
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.11'
          cache-environment: "false"
      - run: uv pip install --python .venv "pytest==8.0.0"
      - name: Execute the shared affected-file plan on pytest 8.0
        env:
          CI_PLANNER_RESULT: ${{ needs.select-tests.result }}
          CI_TEST_MODE: ${{ needs.select-tests.outputs.mode }}
          CI_TEST_FILES: ${{ needs.select-tests.outputs.files }}
        run: uv run --no-sync python scripts/run_ci_tests.py -q -p no:cacheprovider

  build:
    name: Build and smoke the installed wheel
    needs: select-tests
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.13'
          cache-environment: "false"
      - run: uv build
      - run: uv run --no-sync twine check --strict dist/*
      - run: uv run --no-sync python -m pytest tests/test_release.py -q -p no:cacheprovider
      # A fresh environment outside the checkout: pytest discovers the plugin only through the wheel's entry point.
      - name: Installed wheel runs the example contract
        if: ${{ needs.select-tests.result != 'success' || fromJSON(needs.select-tests.outputs.lanes).tests }}
        run: uv run --no-sync python scripts/smoke_distribution.py dist/pytest_quint_connect-*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist
          if-no-files-found: error

  consumer-install:
    name: Installed wheel (${{ matrix.os }})
    needs: [select-tests, build]
    if: >-
      ${{ always() && !cancelled() && needs.build.result == 'success' && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - shell: bash
        run: uv run --no-project python scripts/smoke_distribution.py dist/pytest_quint_connect-*.whl

  dogfood:
    name: Dogfood (the plugin checks its own receipts)
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).dogfood) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.13'
          cache-environment: "false"
      # Quint generates histories of pytest sessions; each step runs a real pytest session of the LRU
      # example with this checkout's plugin, and four mutants of the plugin's own receipt logic must be caught.
      - name: Session-receipts contract
        env:
          PYTEST_QUINT_CONNECT_CACHE: ${{ runner.temp }}/quint-cache
        run: uv run --no-sync pytest dogfood --quint-require-complete --junitxml=dogfood/.artifacts/junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dogfood-quint-connect
          path: dogfood/.artifacts
          # upload-artifact skips dot-directories unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error

  lint-ci:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/actions/lint-ci-code@v1
        with:
          workflow-files: |
            .github/workflows/ci.yml
            .github/workflows/observe-ci.yml
            .github/workflows/pr-title.yml
            .github/workflows/release-please.yml
            .github/workflows/release.yml
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  gate:
    # CI-esta's observer and the branch ruleset both look for this exact name.
    name: Validation gate
    if: ${{ !cancelled() }}
    needs: [select-tests, quality, test, minimum-pytest, build, consumer-install, dogfood, lint-ci]
    runs-on: ubuntu-latest
    steps:
      # The one check to require. A lane job may be skipped only when the planner succeeded and returned false
      # for that lane; any other missing, failed, cancelled or skipped prerequisite fails the gate.
      - uses: gigaverse-app/ci-esta/actions/validation-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
          lanes: ${{ needs.select-tests.outputs.lanes || '{}' }}
          lane-jobs: '{"test":["tests"],"minimum-pytest":["tests"],"consumer-install":["tests"],"dogfood":["dogfood"]}'
