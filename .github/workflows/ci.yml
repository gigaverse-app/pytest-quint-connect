name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Only newer revisions of the same PR supersede work; keep every main/manual run.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  select-tests:
    name: Select tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Receipts are completed steps of earlier runs' jobs.
      checks: read
      pull-requests: read
    env:
      # The jobs whose passing first attempts can prove the tests lane, by exact job name.
      TEST_LANE_JOBS: >-
        {"py311-ubuntu":"Test (Python 3.11, ubuntu-latest)","py311-windows":"Test (Python 3.11, windows-latest)",
        "py311-macos":"Test (Python 3.11, macos-latest)","py314-ubuntu":"Test (Python 3.14, ubuntu-latest)",
        "py314-windows":"Test (Python 3.14, windows-latest)","py314-macos":"Test (Python 3.14, macos-latest)",
        "minimum":"Test with pytest 8.0 (Python 3.11)"}
    outputs:
      # Planned lanes after reuse: CI-esta reports the tests lane false only when every job named in lane-keys is proven,
      # and ci-esta check-workflow (quality job) proves those keys name every job the lane gates, each matrix cell included.
      # Without evidence (manual runs, Publish, test:full) the plan stands.
      lanes: ${{ steps.evidence.outputs.admitted-lanes || steps.plan.outputs.lanes }}
      mode: ${{ steps.files.outputs.mode }}
      files: ${{ steps.files.outputs.test_roots_json }}
      receipt: ${{ steps.evidence.outputs.receipt }}
      reused: ${{ steps.evidence.outputs.reused }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Whole lanes first: a change that cannot affect a lane's inputs does not start that lane's jobs.
      - id: plan
        uses: gigaverse-app/pytest-selective/actions/plan-lanes@v1
        with:
          config: .github/test-lanes.json
      # GitHub often omits a run's pull_requests link. This marker binds the run to its PR and head, so the push
      # after a squash merge can use this run's receipts and pytest-selective can advance its base between pushes.
      # CI-esta matches the exact name.
      - name: "PR evidence #${{ github.event.pull_request.number }} head ${{ github.event.pull_request.head.sha }}"
        if: github.event_name == 'pull_request'
        run: 'true'
      # Everything the tests lane executes or reads (tests/.gv-dependencies.yaml), bound into each receipt.
      - id: inputs
        run: echo "paths=$(jq -c . .github/validation-inputs.json)" >> "$GITHUB_OUTPUT"
      - name: Share the lane graph and execution inputs with file selection
        run: |
          uv run --no-project --python 3.14 --with "$(python3 scripts/ci/selector_requirement.py)" \
            python scripts/ci_file_config.py "$RUNNER_TEMP/test-impact.json"
      # Then files: within the tests lane, only the test files the change can reach.
      - id: files
        uses: gigaverse-app/pytest-selective@v1
        with:
          config: ${{ runner.temp }}/test-impact.json
          full-roots: tests
      # CI-esta reuses a passing first attempt of the same job when its inputs and selected files are identical:
      # after a squash merge, and on a PR push that changes nothing the tests read. Release Publish (workflow_call),
      # manual runs and the test:full label always execute.
      - id: evidence
        if: >-
          ${{ (github.event_name == 'pull_request' || github.event_name == 'push') &&
              !contains(github.event.pull_request.labels.*.name, 'test:full') }}
        uses: gigaverse-app/ci-esta/actions/resolve-lane-evidence@v1
        with:
          lanes: ${{ env.TEST_LANE_JOBS }}
          execution-context: ${{ steps.files.outputs.mode }} ${{ steps.files.outputs.test_roots_json }}
          input-paths: ${{ steps.inputs.outputs.paths }}
          reuse-after-merge: 'true'
          reuse-version-only-release: 'true'
          planned-lanes: ${{ steps.plan.outputs.lanes }}
          lane-keys: '{"tests":["py311-ubuntu","py311-windows","py311-macos","py314-ubuntu","py314-windows","py314-macos","minimum"]}'

  quality:
    name: Lint, docs and gate contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.13'
          cache-environment: "false"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python scripts/check_docs.py
      # Static and cheap, so it always runs: the gate, job conditions and lane file cannot drift apart.
      - name: Check the aggregate gate against the execution lanes
        run: >-
          uv run --no-project --python 3.14
          --with "ci-esta[selection]>=1.13.0,<2.0.0"
          ci-esta check-workflow --workflow .github/workflows/ci.yml --lanes .github/test-lanes.json

  routing:
    name: Routing regressions
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).routing) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Prove lane and file routing on real Git snapshots
        run: >-
          uv run --no-project --python 3.14
          --with "$(python3 scripts/ci/selector_requirement.py)"
          python -m unittest discover -s ci_tests -v

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      # Quint runs on Node.js; the plugin installs its locked Quint 0.33.1 with npm on first use.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: ${{ matrix.python }}
          cache-environment: "false"
      - name: Execute the shared affected-file plan, with real Quint generation
        env:
          PYTEST_QUINT_CONNECT_CACHE: ${{ runner.temp }}/quint-cache
          CI_PLANNER_RESULT: ${{ needs.select-tests.result }}
          CI_TEST_MODE: ${{ needs.select-tests.outputs.mode }}
          CI_TEST_FILES: ${{ needs.select-tests.outputs.files }}
        run: >-
          uv run --no-sync python scripts/run_ci_tests.py -q -p no:cacheprovider --durations=20
          --junitxml=test-timings.xml
      # CI-esta keeps per-test durations from every run, so slow tests and runner variance stay visible.
      - uses: gigaverse-app/ci-esta/actions/learn-test-timings@v1
        if: ${{ !cancelled() && hashFiles('test-timings.xml') != '' }}
        with:
          junit-pattern: test-timings.xml
          artifact-name: test-timings-${{ matrix.python }}-${{ matrix.os }}
      - name: ${{ needs.select-tests.outputs.receipt || 'No execution receipt' }}
        if: ${{ needs.select-tests.result == 'success' && needs.select-tests.outputs.receipt != '' }}
        run: echo 'Recording a completed execution of this job for this tested tree and selection.'

  minimum-pytest:
    name: Test with pytest 8.0 (Python 3.11)
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.11'
          cache-environment: "false"
      - run: uv pip install --python .venv "pytest==8.0.0"
      - name: Execute the shared affected-file plan on pytest 8.0
        env:
          CI_PLANNER_RESULT: ${{ needs.select-tests.result }}
          CI_TEST_MODE: ${{ needs.select-tests.outputs.mode }}
          CI_TEST_FILES: ${{ needs.select-tests.outputs.files }}
        run: uv run --no-sync python scripts/run_ci_tests.py -q -p no:cacheprovider
      - name: ${{ needs.select-tests.outputs.receipt || 'No execution receipt' }}
        if: ${{ needs.select-tests.result == 'success' && needs.select-tests.outputs.receipt != '' }}
        run: echo 'Recording a completed execution of this job for this tested tree and selection.'

  build:
    name: Build and smoke the installed wheel
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).package) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.13'
          cache-environment: "false"
      - run: uv build
      - run: uv run --no-sync twine check --strict dist/*
      - run: uv run --no-sync python -m pytest tests/test_release.py -q -p no:cacheprovider
      # A fresh environment outside the checkout: pytest discovers the plugin only through the wheel's entry point.
      - name: Installed wheel runs the example contract
        run: uv run --no-sync python scripts/smoke_distribution.py dist/pytest_quint_connect-*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist
          if-no-files-found: error

  consumer-install:
    name: Installed wheel (${{ matrix.os }})
    needs: [select-tests, build]
    if: >-
      ${{ always() && !cancelled() && needs.build.result == 'success' && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).package) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - shell: bash
        run: uv run --no-project python scripts/smoke_distribution.py dist/pytest_quint_connect-*.whl

  dogfood:
    name: Quint contracts (example and dogfood)
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).dogfood) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # The contract report's sticky comment.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: gigaverse-app/ci-esta/actions/setup-cached-uv@v1
        with:
          python-version: '3.13'
          cache-environment: "false"
      - name: Sticky comment publisher
        run: node --test report/publish.test.cjs
      - name: LRU example contract
        env:
          PYTEST_QUINT_CONNECT_CACHE: ${{ runner.temp }}/quint-cache
        run: uv run --no-sync pytest examples/lru_cache --quint-require-complete -p no:cacheprovider
      # Quint generates histories of pytest sessions; each step runs a real pytest session of the LRU
      # example with this checkout's plugin, and four mutants of the plugin's own receipt logic must be caught.
      - name: Session-receipts contract
        if: ${{ !cancelled() }}
        env:
          PYTEST_QUINT_CONNECT_CACHE: ${{ runner.temp }}/quint-cache
        run: uv run --no-sync pytest dogfood --quint-require-complete --junitxml=dogfood/.artifacts/junit.xml
      # The adoption this repository recommends: one step after pytest. It reports this repository's own
      # contract in the sticky comment and fails if README.md's contract block no longer matches its receipt.
      # The LRU example above is a teaching example run as a smoke test, so it is not reported.
      - name: Contract report
        if: ${{ !cancelled() }}
        uses: ./report
        with:
          receipts: dogfood/.artifacts/quint-connect/results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dogfood-quint-connect
          path: dogfood/.artifacts
          # upload-artifact skips dot-directories unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error

  lint-ci:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gigaverse-app/ci-esta/actions/lint-ci-code@v1
        with:
          workflow-files: |
            .github/workflows/ci.yml
            .github/workflows/observe-ci.yml
            .github/workflows/pr-title.yml
            .github/workflows/release-please.yml
            .github/workflows/release.yml
            .github/workflows/dry-lint.yml
            .github/workflows/dry-lint-judge.yml
            .github/workflows/dry-lint-audit.yml
            .github/workflows/docs.yml
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  gate:
    # CI-esta's observer and the branch ruleset both look for this exact name.
    name: Validation gate
    if: ${{ !cancelled() }}
    needs: [select-tests, quality, routing, test, minimum-pytest, build, consumer-install, dogfood, lint-ci]
    runs-on: ubuntu-latest
    steps:
      # The one check to require. A lane job may be skipped only when the planner succeeded and returned false
      # for that lane; any other missing, failed, cancelled or skipped prerequisite fails the gate.
      - uses: gigaverse-app/ci-esta/actions/validation-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
          lanes: ${{ needs.select-tests.outputs.lanes || '{}' }}
          lane-jobs: >-
            {"routing":["routing"],"test":["tests"],"minimum-pytest":["tests"],"build":["package"],
            "consumer-install":["package"],"dogfood":["dogfood"]}
