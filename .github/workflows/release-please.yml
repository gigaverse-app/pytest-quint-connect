name: Release Please

# Release PRs accumulate changes; merging one is the publishing decision. Every push to main updates the
# open release PR at once. Publishing is still gated: Publish (release.yml) reruns the full CI on the release
# tag before anything reaches PyPI.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Pushes are processed in order; a later push sees every earlier merge on main.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: release-automation
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require release bot authentication
        env:
          HAS_RELEASE_TOKEN: ${{ secrets.GV_CI_CROSS_REPO_TOKEN != '' }}
        run: |
          if [[ "$HAS_RELEASE_TOKEN" != "true" ]]; then
            echo "::error::Share the organization GV_CI_CROSS_REPO_TOKEN secret with this repository."
            exit 1
          fi
      - name: Prepare release PR or publish its GitHub release
        uses: googleapis/release-please-action@v5
        with:
          # This credential triggers CI on release PRs and Publish on releases.
          # GITHUB_TOKEN would suppress those follow-up workflow events.
          token: ${{ secrets.GV_CI_CROSS_REPO_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
