name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.14'
      - name: Require a version-matching tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          uv run --no-project python -c 'import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_REF"] == f"refs/tags/v{version}", "Run publishing from the version-matching v tag"'
  checks:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    # A called workflow gets no more than this, and GitHub refuses to start it when a job asks for more:
    # the contracts job needs the report comment's permission, the receipts job reads earlier runs and checks.
    # ci_tests/test_workflow_permissions.py keeps this grant a superset of what ci.yml requests.
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: write
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-quint-connect/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Publish tested distributions with attestations
        uses: pypa/gh-action-pypi-publish@release/v1

  move-major-tag:
    # Actions are used as gigaverse-app/pytest-quint-connect/report@v1. Like pytest-obligation's, the stable v1
    # alias also follows compatible v0.x releases. An alias only ever moves forward along history.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::'$TAG' is not a release tag of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          MAJOR="${TAG%%.*}"
          TARGET=$(git rev-parse "$TAG^{commit}")
          ALIASES=("$MAJOR")
          if [[ "$MAJOR" == v0 ]]; then
            ALIASES+=(v1)
          fi
          for ALIAS in "${ALIASES[@]}"; do
            REF="refs/tags/$ALIAS"
            PREVIOUS=""
            if [[ -n "$(git ls-remote --refs origin "$REF")" ]]; then
              git fetch origin "$REF"
              PREVIOUS=$(git rev-parse FETCH_HEAD)
              if ! git merge-base --is-ancestor "$PREVIOUS" "$TARGET"; then
                echo "Keeping $ALIAS: this release does not advance its current commit."
                continue
              fi
            fi
            git push --force-with-lease="$REF:$PREVIOUS" origin "$TARGET:$REF"
          done
